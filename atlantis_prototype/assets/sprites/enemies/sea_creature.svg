<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Corrupted Sea Creature - Top-down view -->

  <!-- Shadow (larger, ethereal) -->
  <ellipse cx="32" cy="56" rx="16" ry="5" fill="#00000060"/>

  <!-- Tentacles/appendages -->
  <ellipse cx="18" cy="46" rx="8" ry="16" fill="#5e35b1" opacity="0.7"/>
  <ellipse cx="46" cy="46" rx="8" ry="16" fill="#5e35b1" opacity="0.7"/>
  <ellipse cx="26" cy="50" rx="6" ry="12" fill="#7e57c2" opacity="0.6"/>
  <ellipse cx="38" cy="50" rx="6" ry="12" fill="#7e57c2" opacity="0.6"/>

  <!-- Body (mystical, glowing) -->
  <ellipse cx="32" cy="34" rx="17" ry="20" fill="#673ab7"/>

  <!-- Ethereal glow -->
  <ellipse cx="32" cy="34" rx="14" ry="17" fill="#9575cd" opacity="0.6"/>

  <!-- Head area -->
  <ellipse cx="32" cy="18" rx="12" ry="11" fill="#5e35b1"/>

  <!-- Mystical eye -->
  <ellipse cx="32" cy="18" rx="10" ry="9" fill="#b39ddb"/>

  <!-- Glowing eyes -->
  <circle cx="28" cy="16" r="4" fill="#00e5ff"/>
  <circle cx="36" cy="16" r="4" fill="#00e5ff"/>

  <!-- Eye pupils (eerie) -->
  <circle cx="28" cy="16" r="2" fill="#ffffff"/>
  <circle cx="36" cy="16" r="2" fill="#ffffff"/>

  <!-- Corrupted marks (dark veins) -->
  <path d="M 32 10 Q 28 14 26 18" stroke="#1a237e" stroke-width="2" fill="none" opacity="0.7"/>
  <path d="M 32 10 Q 36 14 38 18" stroke="#1a237e" stroke-width="2" fill="none" opacity="0.7"/>

  <!-- Glowing crystals on body -->
  <polygon points="32,28 29,32 35,32" fill="#00e5ff" opacity="0.8"/>
  <circle cx="24" cy="36" r="3" fill="#00e5ff" opacity="0.7"/>
  <circle cx="40" cy="36" r="3" fill="#00e5ff" opacity="0.7"/>

  <!-- Energy wisps -->
  <ellipse cx="20" cy="24" rx="3" ry="5" fill="#b39ddb" opacity="0.5"/>
  <ellipse cx="44" cy="24" rx="3" ry="5" fill="#b39ddb" opacity="0.5"/>

  <!-- Fins/appendages -->
  <ellipse cx="16" cy="30" rx="5" ry="10" fill="#7e57c2" opacity="0.5"/>
  <ellipse cx="48" cy="30" rx="5" ry="10" fill="#7e57c2" opacity="0.5"/>
</svg>
