<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Bandit - Top-down view -->

  <!-- Shadow -->
  <ellipse cx="32" cy="56" rx="11" ry="4" fill="#00000040"/>

  <!-- Body (Dark cloak) -->
  <ellipse cx="32" cy="36" rx="15" ry="19" fill="#455a64"/>

  <!-- Cloak details -->
  <ellipse cx="32" cy="28" rx="13" ry="12" fill="#37474f"/>

  <!-- Arms (holding weapons) -->
  <ellipse cx="19" cy="32" rx="5" ry="9" fill="#d4a574"/>
  <ellipse cx="45" cy="32" rx="5" ry="9" fill="#d4a574"/>

  <!-- Head (hooded) -->
  <circle cx="32" cy="18" r="9" fill="#5d4037"/>

  <!-- Hood -->
  <ellipse cx="32" cy="14" rx="11" ry="9" fill="#37474f"/>
  <ellipse cx="32" cy="12" rx="10" ry="6" fill="#263238"/>

  <!-- Face in shadow -->
  <ellipse cx="32" cy="18" rx="7" ry="8" fill="#3e2723"/>

  <!-- Eyes (menacing) -->
  <circle cx="28" cy="17" r="2" fill="#ff6b6b"/>
  <circle cx="36" cy="17" r="2" fill="#ff6b6b"/>

  <!-- Dagger (left hand) -->
  <rect x="16" y="30" width="2" height="10" fill="#b0bec5" rx="0.5"/>
  <polygon points="17,28 15,30 19,30" fill="#90a4ae"/>

  <!-- Scar/mask -->
  <rect x="26" y="20" width="12" height="3" fill="#263238" rx="1"/>

  <!-- Belt with pouches -->
  <rect x="22" y="42" width="20" height="3" fill="#5d4037" rx="1"/>
  <rect x="26" y="44" width="4" height="5" fill="#795548" rx="1"/>
  <rect x="34" y="44" width="4" height="5" fill="#795548" rx="1"/>
</svg>
